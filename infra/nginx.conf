# NGINX Configuration for Production
# This is a reference configuration - adjust for your deployment

upstream api_backend {
    server api:3001;
    keepalive 32;
}

upstream ai_orchestrator_backend {
    server ai-orchestrator:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.aivora.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.aivora.example.com;

    ssl_certificate /etc/nginx/ssl/api.aivora.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.aivora.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # API routes
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI Orchestrator routes (internal only)
    location /ai/ {
        proxy_pass http://ai_orchestrator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health checks
    location /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }

    # WebSocket support for Twilio
    location /voice/webhook/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# Internal server for AI Orchestrator (not exposed publicly)
server {
    listen 8000;
    server_name ai-orchestrator.internal;

    location / {
        proxy_pass http://ai_orchestrator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}